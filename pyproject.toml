[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage"
version = "0.1.0"
description = "AI Telemetry, Prompt Drift Analysis & Observability Platform"
authors = [{ name = "VANTAGE Contributor" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "sqlalchemy>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.15.0",
    "scipy>=1.10.0",
    "duckdb>=0.9.0",
    "dbt-duckdb>=1.6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0"
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.18.0"
]
dev = [
    "pytest>=7.4.0",
    "anthropic>=0.18.0"
]

[tool.setuptools.packages.find]
where = ["src"]
