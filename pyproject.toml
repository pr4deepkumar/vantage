[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage"
dynamic = ["version"]
description = "LLM telemetry and observability: distributed tracing, token and cost accounting, drift detection and response evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "sqlalchemy>=2.0.0",
  "pandas>=2.0.0",
]

[project.optional-dependencies]
# Run the traced workload on this machine: an open chat model and an NLI grounding checker
# (Hugging Face models, downloaded once on first use; no API keys).
local = [
  "transformers>=4.56",
  "torch>=2.3",
]
# Trace Claude calls and grade responses with a Claude judge (LLM_PROVIDER=claude).
# 2.x: output_config (effort, structured outputs), server-side refusal fallbacks, no sampling params.
claude = [
  "anthropic>=2.9.0,<3",
]
# PostgreSQL trace store (the AWS deployment).
postgres = [
  "psycopg[binary]>=3.2",
]
# The analytics marts in dbt/.
dbt = [
  "dbt-duckdb>=1.10",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",  # required by fastapi.testclient
  "ruff>=0.6",
]

[tool.setuptools.dynamic]
version = { attr = "vantage.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vantage = ["web/*.html", "web/css/*.css", "web/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# `ruff format` handles line length.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["vantage"]
